# Configuration for the daily Hubscape / Visits API / ICe2 visit reconciliation.
# Edit this file to retune the automation without touching any code.

sql:
  ice2:
    server: "GCV-PROD-SQL01"
    database: "information_centre"
    driver: "ODBC Driver 17 for SQL Server"
    auth: "trusted"                 # Windows integrated auth (Trusted_Connection=yes)
    query_start_date: "2025-10-01"  # CONFIRM: matches the existing workbook's cutoff filter
    # Field Teams not yet ingested into Hubscape - omit entirely from the extract rather than
    # letting them permanently show up as "missing from Hubscape" false positives downstream.
    excluded_contractor_ids: [3244, 8030, 8031]
    # DE (directly-employed) teams are known not to be ingested into Hubscape yet - omit them
    # entirely from the extract, same rationale as excluded_contractor_ids above. Flip to false
    # once Hubscape starts ingesting DE team visits.
    exclude_de_teams: true
  visits_api_excel:
    # The direct Azure SQL connection (ActiveDirectoryInteractive) needed a fresh interactive
    # Entra sign-in roughly daily, which an unattended overnight run can't complete. Instead,
    # this workbook has a live Power Query connection to the same database that a human keeps
    # warm just by opening it occasionally - the pipeline drives Excel via COM to refresh it
    # and reads the resulting table instead of querying the database directly.
    path: "API Status.xlsx"     # relative to the project root, or an absolute path
    sheet_name: "Visit"
    table_name: "Query1"
    status_title_column: "Title"   # CONFIRM against live visitstatus schema
    # Give up if Excel hasn't finished refreshing the connection within this many seconds.
    refresh_timeout_seconds: 180

recency:
  # Hubscape's integration rolled out gradually, so an old visit missing from Hubscape is
  # expected/low-priority, while a *recent* one missing is a genuine, actionable gap.
  # A visit counts as "recent" if its ExpectedEndDate (falling back to ExpectedStartDate) is
  # within this many days of today (including visits still in the future).
  recent_window_days: 30

statuses:
  # Statuses that are legitimately excluded from Hubscape's "active visits only" export.
  legitimately_excluded_from_hubscape: [5, 10, 50, 55, 60, 70]
  legend:
    5: "Not Ready To Send"
    10: "Ready to Send"
    15: "Visit Sent"
    20: "In Progress"
    35: "No Access"
    50: "Will Never Be Done - Cancelled"
    55: "On-Hold"
    60: "Completed"
    70: "Manually Completed"

email:
  trigger:
    sender_filter: "ci@hubscape.co.uk"
    subject_contains: ""           # optional extra filter; blank = match on sender alone
    search_folder: "Inbox"
    typical_arrival_time: "20:30"
    lookback_hours: 24             # how far back to search for "today's" email
    attachment_name_pattern: "production_uncompleted_visits_*.csv"
  recipients:
    to: ["alex.clark@ground-control.co.uk", "chris.beanland@ground-control.co.uk", "eion.donnelly@ground-control.co.uk"]
    cc: []
  send_on_success: true
  send_on_failure: true
  # No send-confirmation/Outbox-cleanup settings needed here - Microsoft Graph's sendMail is a
  # single synchronous HTTPS call (202 Accepted or an error, immediately). There's no local
  # Outbox to poll or clean up, unlike the old Outlook COM path. See graph: below.

graph:
  # Entra ID app registration (app-only / client-credentials) issued by ICT for this pipeline.
  # Requires admin consent for BOTH Mail.Send and Mail.Read under Microsoft Graph ->
  # Application permissions (not Delegated) - verify the Status column shows a green "Granted
  # for <tenant>" against both before relying on this (it's easy for one of the two to be
  # missed during setup and still look consented on the row that was added).
  tenant_id: "3ef9f654-aa07-41b8-88ad-a411c62bd12c"   # Directory (tenant) ID, from the app registration's Overview page
  client_id: "35aa14d5-100f-4656-a2d1-42147d9b39df"   # Application (client) ID, from the same page
  # Client secret is deliberately NOT stored here. Set GRAPH_CLIENT_SECRET in a local .env file
  # (copy .env.example -> .env and fill it in) or as a real environment variable. .env is
  # gitignored - never commit the real secret.
  mailbox: "alex.clark@ground-control.co.uk"   # mailbox to send from / search in (app-only auth has no "me")
  request_timeout_seconds: 30
  max_retries: 3   # extra attempts for retryable Graph errors (429/5xx), with backoff
  max_inline_attachment_bytes: 3000000   # combined raw attachment bytes before sendMail gets unreliable inline
  mail_search_page_size: 50
  mail_search_max_pages: 5

notifications:
  teams:
    # Last-resort fallback: only used when Outlook can't send the failure-alert email either
    # (see README "Known limitation"). One-time setup: in the target Teams channel, "..." >
    # Workflows > "Post to a channel when a webhook request is received" > complete the wizard >
    # paste the URL it gives you here. Leave null until set up - a missing URL just logs a
    # warning instead of failing the run.
    webhook_url: https://default3ef9f654aa0741b888ada411c62bd1.2c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/cecdd497888b430fb0a31c2858cae152/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=-HMmAIYcKwMjMjMnCNy_srHeQwT_U0cbInr4885NZXA

hubscape_columns:
  # Confirmed against a real export (production_uncompleted_visits_*.csv). Hubscape only
  # exposes the API_ID it received via the Visits API - it never sees ICe2's own VisitID.
  api_id_column: "External Visit API Id"
  status_column: "Status"       # e.g. SCHEDULED / UNSCHEDULED - informational, not currently used for matching

run:
  output_dir: "./output"
  keep_days: 90        # local cleanup of old output folders
  test_mode: false       # true = run the full pipeline but write the would-be email to output/ instead of sending
